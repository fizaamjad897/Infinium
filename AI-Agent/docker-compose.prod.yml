# docker-compose.prod.yml — Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# This file EXTENDS docker-compose.yml — run both together.
#
# Prod runs WITHOUT a local Ollama container. Set OLLAMA_BASE_URL in .env to a
# remote Ollama (e.g. https://<your>.trycloudflare.com pointing at your Mac).
# The base file's `ollama` service is gated behind the "local-ollama" profile
# and will not start unless that profile is explicitly activated.

services:
  backend:
    depends_on:
      - postgres
    environment:
      - GITHUB_API_TOKEN=${GITHUB_API_TOKEN}
    deploy:
      resources:
        limits:
          memory: 768M
    restart: always

  postgres:
    command: postgres -c shared_buffers=64MB -c max_connections=50
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always
