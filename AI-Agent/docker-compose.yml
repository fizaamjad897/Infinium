services:
  # ── Ollama (Local/Cloud LLM Server) ──
  # Behind the "local-ollama" profile — only starts if you explicitly enable it
  # with: docker compose --profile local-ollama up -d
  # Prod skips this and uses a remote Ollama via OLLAMA_BASE_URL (tunnel).
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Infinium Backend (FastAPI + RAG) ──
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Default points at in-cluster ollama; prod override sets a tunnel URL.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - LLM_MODEL=${LLM_MODEL:-minimax-m2.7:cloud}
      - CODE_REASONING_MODEL=${CODE_REASONING_MODEL:-kimi-k2.5:cloud}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      # OFF by default for speed — user can pass use_dual_model=true per-request
      - USE_DUAL_MODEL=${USE_DUAL_MODEL:-false}
      - CHROMA_DB_PATH=/app/chroma_db
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:8000/api/auth/github/callback}
      - JWT_SECRET=${JWT_SECRET:-infinium-dev-secret}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
    volumes:
      - chroma_data:/app/chroma_db
      - repo_cache:/app/repo_cache
      - app_data:/app/data
    # Don't hard-depend on the ollama container — prod uses a remote Ollama and
    # ollama runs only with the "local-ollama" profile in dev.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── PostgreSQL (user data, query logs) ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infinium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infinium_secret}
      POSTGRES_DB: infinium
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinium"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  chroma_data:
  repo_cache:
  app_data:
  postgres_data:
