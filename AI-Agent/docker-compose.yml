version: "3.9"

services:
  # ── Ollama (Local/Cloud LLM Server) ──
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # After first deploy, pull models:
    # docker exec infinium-ollama-1 ollama pull nomic-embed-text
    # docker exec infinium-ollama-1 ollama run minimax-m2.7:cloud
    # docker exec infinium-ollama-1 ollama run kimi-k2.5:cloud

  # ── Infinium Backend (FastAPI + RAG) ──
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-minimax-m2.7:cloud}
      - CODE_REASONING_MODEL=${CODE_REASONING_MODEL:-kimi-k2.5:cloud}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      # OFF by default for speed — user can pass use_dual_model=true per-request
      - USE_DUAL_MODEL=${USE_DUAL_MODEL:-false}
      - CHROMA_DB_PATH=/app/chroma_db
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:8000/api/auth/github/callback}
      - JWT_SECRET=${JWT_SECRET:-infinium-dev-secret}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
    volumes:
      - chroma_data:/app/chroma_db
      - repo_cache:/app/repo_cache
      - app_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── PostgreSQL (user data, query logs) ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infinium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infinium_secret}
      POSTGRES_DB: infinium
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinium"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  chroma_data:
  repo_cache:
  app_data:
  postgres_data:
